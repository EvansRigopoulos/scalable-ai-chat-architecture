services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai_chat_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../app:/app/app
      # Evidentrace SDK (local editable) — importable via PYTHONPATH
      - /Users/evangelosrigopoulos/Documents/Evidentrace.ai/sdk:/evidentrace-sdk:ro
    environment:
      PYTHONPATH: /evidentrace-sdk
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chat_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15
    container_name: ai_chat_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatdb
    ports:
      # host 5433: local brew postgres already owns 5432 (used by the
      # evidentrace compute engine's result store)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chat_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U postgres -d chatdb" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4
    container_name: ai_chat_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db  # <--- Changed from ai_chat_db to db to match service key
    networks:
      - chat_network

volumes:
  pgdata:
  pgadmin_data:

networks:
  chat_network:
    driver: bridge