services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai_chat_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../app:/app/app
    networks:
      - chat_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:15
    container_name: ai_chat_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - chat_network

  pgadmin:
    image: dpage/pgadmin4
    container_name: ai_chat_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8080:80"
    depends_on:
      - db  # <--- Changed from ai_chat_db to db to match service key
    networks:
      - chat_network

volumes:
  pgdata:

networks:
  chat_network:
    driver: bridge